# When you publish a release on GitHub, this builds the debug APK and attaches it to that release.
# Commits and merges do not make a release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write # upload the APK and edit the release notes

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # checks out the release tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test the server
        run: go test ./server

      - name: Build server.aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          gomobile init
          mkdir -p android/app/libs # gitignored, so not in the checkout
          gomobile bind -target=android/arm64,android/amd64 -androidapi 30 -javapkg com.shareit \
            -o android/app/libs/server.aar ./server

      - name: Build the APK
        working-directory: android
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ./gradlew assembleDebug -Pshareit.version="${TAG#v}"

      - name: Attach the APK and the install notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp android/app/build/outputs/apk/debug/share-it-debug.apk share-it.apk
          gh release upload "$TAG" share-it.apk --clobber
          { gh release view "$TAG" --json body -q .body; echo; cat .github/release-notes.md
            printf '\nSHA-256 of share-it.apk: `%s`\n' "$(sha256sum share-it.apk | cut -d' ' -f1)"; } > notes.md
          gh release edit "$TAG" --notes-file notes.md
